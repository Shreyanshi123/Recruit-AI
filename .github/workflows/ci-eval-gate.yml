name: HireRoom AI — CI Test & Golden Eval Regression Gate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-tests-and-eval-gate:
    name: Backend Integration & Golden Eval Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Sandbox Security & Pipeline Integration Suite
        run: python tests/test_enterprise_pipeline.py

      - name: Run Golden Dataset Judge Accuracy & Injection/Bias CI Gate
        run: python ai_engine/evals/run_evals.py

